<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindle Notes Viewer</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --privacy-bg: #eff6ff;
      --privacy-border: #bfdbfe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 28px 36px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .subtitle { color: var(--muted); margin: 0; line-height: 1.55; }
    .privacy-notice {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--privacy-border);
      background: var(--privacy-bg);
      border-radius: 12px;
      color: #1e3a8a;
      line-height: 1.55;
      font-size: 14px;
    }
    .privacy-notice strong { color: #1e40af; }
    .lang-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .lang-switch select {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      background: white;
      color: var(--text);
      font-size: 14px;
    }
    .container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      padding: 18px;
      min-height: calc(100vh - 155px);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .left { display: flex; flex-direction: column; }
    .upload-box { padding: 18px; border-bottom: 1px solid var(--border); }
    input[type="file"] { width: 100%; margin: 10px 0 12px; }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .stats { padding: 12px 18px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    .search { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .search input {
      width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); font-size: 14px;
    }
    .book-list { overflow: auto; }
    .book-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .book-item:hover, .book-item.active { background: #eef4ff; }
    .book-title { font-size: 14px; line-height: 1.4; word-break: break-word; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .content-header {
      padding: 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .content-title { margin: 0 0 6px; font-size: 20px; line-height: 1.35; }
    .content-meta { color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: var(--accent-dark); }
    button.secondary { background: #111827; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .notes { padding: 18px; overflow: auto; max-height: calc(100vh - 210px); }
    .note {
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .note-number { color: var(--accent); font-weight: 600; margin-right: 6px; }
    .empty {
      padding: 48px 18px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
    }
    @media (max-width: 820px) {
      header { padding: 22px 18px 16px; }
      .topbar { flex-direction: column; }
      .container { grid-template-columns: 1fr; padding: 12px; }
      .notes { max-height: none; }
      .content-header { flex-direction: column; }
      .actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1 data-i18n="title">Kindle 笔记查看器</h1>
        <p class="subtitle" data-i18n-html="subtitle">上传 Kindle <strong>My Clippings.txt</strong> 文件，按书籍浏览笔记，并单独下载任意一本书的笔记。</p>
      </div>
      <label class="lang-switch">
        <span data-i18n="languageLabel">语言</span>
        <select id="languageSelect" aria-label="Language">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
    <div class="privacy-notice" data-i18n-html="privacyNotice">
      <strong>隐私说明：</strong>本工具会在你的浏览器本地解析 Kindle 文件。你的笔记不会被上传、保存或发送到任何服务器。
    </div>
  </header>

  <main class="container">
    <section class="panel left">
      <div class="upload-box">
        <strong data-i18n="selectFile">选择文件</strong>
        <input id="fileInput" type="file" accept=".txt,text/plain" />
        <div class="hint" data-i18n-html="hint">请选择 Kindle 导出的 <strong>My Clippings.txt</strong> 文件。当前版本支持中文 Kindle clipping 格式。</div>
      </div>
      <div id="stats" class="stats">尚未导入文件。</div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜索书籍" disabled />
      </div>
      <div id="bookList" class="book-list">
        <div class="empty" data-i18n="emptyBookList">导入文件后，书籍列表会显示在这里。</div>
      </div>
    </section>

    <section class="panel">
      <div class="content-header">
        <div>
          <h2 id="contentTitle" class="content-title">尚未选择书籍</h2>
          <div id="contentMeta" class="content-meta">请先上传 My Clippings.txt。</div>
        </div>
        <div class="actions">
          <button id="downloadCurrent" disabled data-i18n="downloadCurrent">下载当前书籍</button>
          <button id="downloadAll" class="secondary" disabled data-i18n="downloadAll">下载全部笔记</button>
        </div>
      </div>
      <div id="notes" class="notes">
        <div class="empty" data-i18n="emptyNotes">点击左侧书名查看笔记。</div>
      </div>
    </section>
  </main>

  <script>
    const translations = {
      zh: {
        title: 'Kindle 笔记查看器',
        subtitle: '上传 Kindle <strong>My Clippings.txt</strong> 文件，按书籍浏览笔记，并单独下载任意一本书的笔记。',
        languageLabel: '语言 / Languages',
        privacyNotice: '<strong>隐私说明：</strong>本工具会在你的浏览器本地解析 Kindle 文件。你的笔记不会被上传、保存或发送到任何服务器。',
        selectFile: '选择文件',
        hint: '请选择 Kindle 导出的 <strong>My Clippings.txt</strong> 文件。当前版本支持中文 Kindle clipping 格式。',
        statsInitial: '尚未导入文件。',
        searchPlaceholder: '搜索书籍',
        emptyBookList: '导入文件后，书籍列表会显示在这里。',
        noBookSelected: '尚未选择书籍',
        uploadFirst: '请先上传 My Clippings.txt。',
        downloadCurrent: '下载当前书籍',
        downloadAll: '下载全部笔记',
        emptyNotes: '点击左侧书名查看笔记。',
        noMatchingBooks: '没有找到匹配的书籍。',
        notesUnit: '条笔记',
        imported: (books, notes) => `已导入 ${books} 本书，${notes} 条笔记。`,
        clickBook: '点击左侧书名查看笔记。',
        noRecognized: '没有识别到可用笔记。请确认文件来自中文 Kindle My Clippings.txt 格式。',
        allFilename: 'all_kindle_notes_sorted.txt'
      },
      en: {
        title: 'Kindle Notes Viewer',
        subtitle: 'Upload your Kindle <strong>My Clippings.txt</strong> file, browse notes by book, and download notes from any individual book.',
        languageLabel: 'Language',
        privacyNotice: '<strong>Privacy notice:</strong> this tool processes your Kindle file locally in your browser. Your notes are not uploaded, stored, or sent to any server.',
        selectFile: 'Select file',
        hint: 'Choose the <strong>My Clippings.txt</strong> file exported from your Kindle. This version currently supports the Chinese Kindle clipping format.',
        statsInitial: 'No file imported yet.',
        searchPlaceholder: 'Search books',
        emptyBookList: 'After importing a file, the book list will appear here.',
        noBookSelected: 'No book selected',
        uploadFirst: 'Please upload My Clippings.txt first.',
        downloadCurrent: 'Download this book',
        downloadAll: 'Download all notes',
        emptyNotes: 'Click a book title on the left to view its notes.',
        noMatchingBooks: 'No matching books found.',
        notesUnit: 'notes',
        imported: (books, notes) => `Imported ${books} books and ${notes} notes.`,
        clickBook: 'Click a book title on the left to view its notes.',
        noRecognized: 'No usable notes were recognized. Please make sure the file is from the Chinese Kindle My Clippings.txt format.',
        allFilename: 'all_kindle_notes_sorted.txt'
      }
    };

    const fileInput = document.getElementById('fileInput');
    const languageSelect = document.getElementById('languageSelect');
    const searchInput = document.getElementById('searchInput');
    const bookList = document.getElementById('bookList');
    const stats = document.getElementById('stats');
    const contentTitle = document.getElementById('contentTitle');
    const contentMeta = document.getElementById('contentMeta');
    const notesDiv = document.getElementById('notes');
    const downloadCurrentBtn = document.getElementById('downloadCurrent');
    const downloadAllBtn = document.getElementById('downloadAll');

    let currentLanguage = localStorage.getItem('kindleNotesLanguage') || 'zh';
    let books = [];
    let selectedBookIndex = null;

    function t(key) {
      return translations[currentLanguage][key];
    }

    function applyLanguage() {
      document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';
      languageSelect.value = currentLanguage;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        el.innerHTML = t(el.dataset.i18nHtml);
      });
      searchInput.placeholder = t('searchPlaceholder');

      if (!books.length) {
        stats.textContent = t('statsInitial');
        contentTitle.textContent = t('noBookSelected');
        contentMeta.textContent = t('uploadFirst');
        bookList.innerHTML = `<div class="empty">${t('emptyBookList')}</div>`;
        notesDiv.innerHTML = `<div class="empty">${t('emptyNotes')}</div>`;
      } else {
        const noteTotal = books.reduce((sum, book) => sum + book.notes.length, 0);
        stats.textContent = t('imported')(books.length, noteTotal);
        if (selectedBookIndex === null) {
          contentTitle.textContent = t('noBookSelected');
          contentMeta.textContent = t('clickBook');
          notesDiv.innerHTML = `<div class="empty">${t('emptyNotes')}</div>`;
        } else {
          const book = books[selectedBookIndex];
          contentTitle.textContent = book.title;
          contentMeta.textContent = `${book.notes.length} ${t('notesUnit')}`;
        }
        renderBookList(searchInput.value);
      }
    }

    function parseTimestamp(timestamp) {
      let cleaned = timestamp.replace(/星期./g, '').trim();
      const isPM = cleaned.includes('下午');
      cleaned = cleaned.replace('上午', '').replace('下午', '').trim();
      const match = cleaned.match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s*(\d{1,2}):(\d{1,2}):(\d{1,2})/);
      if (!match) return new Date(0);
      let [_, y, m, d, h, min, s] = match.map(Number);
      if (isPM && h < 12) h += 12;
      if (!isPM && h === 12) h = 0;
      return new Date(y, m - 1, d, h, min, s);
    }

    function parseClippings(content) {
      const map = new Map();
      const entries = content.split('==========');
      const pattern = /(.*) \((.*)\)\n- 您在位置 #(\d+)-?(\d+)?的标注 \| 添加于 (.*)/;

      for (const rawEntry of entries) {
        const entry = rawEntry.trim();
        if (!entry) continue;
        const lines = entry.split(/\r?\n/);
        if (lines.length < 3) continue;

        const firstTwo = lines.slice(0, 2).join('\n');
        const match = firstTwo.match(pattern);
        if (!match) continue;

        const bookTitle = `${match[1].trim()} (${match[2].trim()})`;
        const start = parseInt(match[3], 10);
        const end = match[4] ? parseInt(match[4], 10) : start;
        const timestamp = match[5].trim();
        const contentText = lines.slice(2).join('\n').trim();
        if (!contentText) continue;

        if (!map.has(bookTitle)) map.set(bookTitle, []);
        map.get(bookTitle).push({
          start_position: start,
          end_position: end,
          timestamp,
          timestamp_dt: parseTimestamp(timestamp),
          content: contentText
        });
      }

      return Array.from(map.entries()).map(([title, notes]) => {
        notes.sort((a, b) => {
          if (a.start_position !== b.start_position) return a.start_position - b.start_position;
          return a.timestamp_dt - b.timestamp_dt;
        });
        return { title, notes };
      }).sort((a, b) => a.title.localeCompare(b.title, currentLanguage === 'zh' ? 'zh-CN' : 'en'));
    }

    function safeFilename(name) {
      return name.replace(/[\\/:*?"<>|]/g, '_').slice(0, 160);
    }

    function bookToText(book) {
      return book.notes.map((note, i) => `${i + 1}. ${note.content}`).join('\n\n') + '\n';
    }

    function downloadText(filename, text) {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderBookList(filter = '') {
      const q = filter.trim().toLowerCase();
      const filtered = books.map((book, index) => ({ book, index }))
        .filter(({ book }) => book.title.toLowerCase().includes(q));

      if (filtered.length === 0) {
        bookList.innerHTML = `<div class="empty">${t('noMatchingBooks')}</div>`;
        return;
      }

      bookList.innerHTML = '';
      for (const { book, index } of filtered) {
        const item = document.createElement('div');
        item.className = 'book-item' + (index === selectedBookIndex ? ' active' : '');
        item.innerHTML = `<div class="book-title"></div><div class="count">${book.notes.length} ${t('notesUnit')}</div>`;
        item.querySelector('.book-title').textContent = book.title;
        item.addEventListener('click', () => selectBook(index));
        bookList.appendChild(item);
      }
    }

    function selectBook(index) {
      selectedBookIndex = index;
      const book = books[index];
      contentTitle.textContent = book.title;
      contentMeta.textContent = `${book.notes.length} ${t('notesUnit')}`;
      downloadCurrentBtn.disabled = false;
      notesDiv.innerHTML = '';
      for (let i = 0; i < book.notes.length; i++) {
        const note = document.createElement('div');
        note.className = 'note';
        const number = document.createElement('span');
        number.className = 'note-number';
        number.textContent = `${i + 1}.`;
        note.appendChild(number);
        note.appendChild(document.createTextNode(' ' + book.notes[i].content));
        notesDiv.appendChild(note);
      }
      renderBookList(searchInput.value);
    }

    fileInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const content = await file.text();
      books = parseClippings(content);
      selectedBookIndex = null;
      const noteTotal = books.reduce((sum, book) => sum + book.notes.length, 0);
      stats.textContent = t('imported')(books.length, noteTotal);
      searchInput.disabled = books.length === 0;
      downloadAllBtn.disabled = books.length === 0;
      downloadCurrentBtn.disabled = true;
      contentTitle.textContent = t('noBookSelected');
      contentMeta.textContent = books.length ? t('clickBook') : t('noRecognized');
      notesDiv.innerHTML = books.length ? `<div class="empty">${t('emptyNotes')}</div>` : `<div class="empty">${t('noRecognized')}</div>`;
      renderBookList();
    });

    searchInput.addEventListener('input', () => renderBookList(searchInput.value));

    languageSelect.addEventListener('change', () => {
      currentLanguage = languageSelect.value;
      localStorage.setItem('kindleNotesLanguage', currentLanguage);
      applyLanguage();
    });

    downloadCurrentBtn.addEventListener('click', () => {
      if (selectedBookIndex === null) return;
      const book = books[selectedBookIndex];
      downloadText(`${safeFilename(book.title)}_notes_sorted.txt`, bookToText(book));
    });

    downloadAllBtn.addEventListener('click', () => {
      if (!books.length) return;
      const allText = books.map(book => `# ${book.title}\n\n${bookToText(book)}`).join('\n\n==========\n\n');
      downloadText(t('allFilename'), allText);
    });

    applyLanguage();
  </script>
</body>
</html>
